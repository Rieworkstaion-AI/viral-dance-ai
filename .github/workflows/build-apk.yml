name: Build Viral Dance AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ViralDanceAI_Android_Project_Updated.zip"
      - "ViralDanceAI_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract the uploaded project ZIP
        run: |
          if [ -f ViralDanceAI_Android_Project_Updated.zip ]; then
            unzip -o ViralDanceAI_Android_Project_Updated.zip
          elif [ -f ViralDanceAI_Android_Project.zip ]; then
            unzip -o ViralDanceAI_Android_Project.zip
          else
            echo "Project ZIP was not found in the repository."
            exit 1
          fi
          test -f ViralDanceAI_Android_Project/package.json
          test -f ViralDanceAI_Android_Project/www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and create Android project
        working-directory: ViralDanceAI_Android_Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ViralDanceAI_Android_Project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: viral-dance-ai-debug-apk
          path: ViralDanceAI_Android_Project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
